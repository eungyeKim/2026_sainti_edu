[project]
name = "sainty-microduck-runtime"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
    "gymnasium>=1.2,<1.3",
    "mujoco==3.3.7",
    "numpy==1.26.4",
    "matplotlib==3.9.4",
    "pillow==11.3.0",
    "onnx==1.17.0",
    "onnxruntime==1.23.2",
    "stable-baselines3==2.7.1",
    "torch==2.4.1",
    "torch-directml==0.2.5.dev240914",
    "torchvision==0.19.1",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
