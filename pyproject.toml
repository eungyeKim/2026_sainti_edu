[project]
name = "sainti"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.10.9",
    "mujoco==3.3.7",
    "pillow>=12.3.0",
]

[project.scripts]
sainti = "sainti:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "python_test",
]
